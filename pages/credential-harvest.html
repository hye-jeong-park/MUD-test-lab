<!-- MUD detection test only / no real malicious behavior -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보안 인증 — 계정 정보 재확인</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <header class="bar"><span class="brand">Account Security Center</span></header>
  <div class="wrap">
    <h1>계정 확인 / 보안 인증</h1>
    <p>비정상 접근이 감지되었습니다. 계정 보호를 위해 아래 <strong>정보 재확인</strong>을 완료해 주세요.</p>

    <div class="note">MUD detection test only — entered values are NOT collected, stored, or sent externally.</div>

    <form id="harvestForm" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="name@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="+1 555 010 0000">

      <label for="code">Verification code</label>
      <input type="text" id="code" name="code" inputmode="numeric" placeholder="6-digit code">

      <button type="submit">정보 재확인 완료</button>
    </form>

    <footer>PII / credential-harvest detection sample · MUD detection test lab</footer>
  </div>

  <script>
    // MUD detection test only — no real collection or transfer.
    document.getElementById("harvestForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      console.log("[credential-harvest] submit (mock only):", Object.keys(data));
      try {
        await fetch("/api/mock-collect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ form: "credential-harvest", fields: Object.keys(data) })
        });
      } catch (_) {}
      alert("Test submission sent to local mock endpoint only.");
    });
  </script>
</body>
</html>
