<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TestBrand Secure Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <h1>TestBrand Secure Login</h1>
  <p>
    이 페이지는 테스트용 브랜드 사칭, PII 입력 폼, 파일 다운로드를 동시에 검증하기 위한 페이지입니다.
  </p>

  <form id="loginForm" method="POST" action="/collect">
    <label>Email</label>
    <input type="email" name="email" autocomplete="off">

    <br><br>

    <label>Password</label>
    <input type="password" name="password" autocomplete="off">

    <br><br>

    <label>Phone</label>
    <input type="tel" name="phone" autocomplete="off">

    <br><br>

    <button type="submit">Login</button>
  </form>

  <hr>

  <p>보안 업데이트 파일을 다운로드하세요.</p>
  <a href="/files/double_archive.zip" download>
    Download security update
  </a>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(e.target);

      // 실제 저장은 server.py에서 하지 않음
      await fetch("/collect", {
        method: "POST",
        body: formData
      });

      alert("Test request sent.");
    });
  </script>
</body>
</html>
